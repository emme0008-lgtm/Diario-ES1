<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b71c1c"><title>Diario Elettrostrumentisti</title><link rel="manifest" href="manifest.json"><style>
:root{font-family:system-ui,Arial;background:#f2f4f7;color:#202733}*{box-sizing:border-box}body{margin:0}header{background:#b71c1c;color:white;padding:19px 15px;text-align:center}header h1{font-size:22px;margin:0}header small{opacity:.9}main{max-width:540px;margin:auto;padding:15px}h2{font-size:19px;margin:12px 0}.card{background:white;border-radius:15px;padding:14px;margin:12px 0;box-shadow:0 2px 9px #0001}button,select,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:12px;background:#26364e;color:white;cursor:pointer}button:active{opacity:.8}.nav{width:100%;margin:5px 0;text-align:left;font-weight:700}.secondary{background:#e7eaf0;color:#253047}.danger{background:#b4232c}.good{background:#197447}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.map{height:260px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;align-items:end;padding:12px 2px}.map button{padding:8px 3px;font-size:12px;line-height:1.35;min-width:0;height:185px;background:#34445f}.map .six{height:225px;background:#8c3a35}.map .five{height:185px;background:#51637e}.map .seven{background:#2c6573}.map .hundred{background:#4e5d79}label{display:block;margin:10px 0 4px;font-weight:650}input,select,textarea{width:100%;border:1px solid #cbd2dc;border-radius:9px;padding:11px;background:white}textarea{min-height:110px}.muted{color:#647084;font-size:13px}.pill{display:inline-block;border-radius:7px;padding:4px 8px;color:white;font-size:12px;font-weight:bold}.open{background:#ba2733}.closed{background:#198052}.entry{border-top:1px solid #e3e6eb;padding:12px 0}.entry p{white-space:pre-wrap;margin:7px 0}.hidden{display:none}.numbergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.numbergrid button{padding:14px 0}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar button{flex:1}.photo{max-width:100%;max-height:200px;border-radius:8px}footer{text-align:center;color:#6c7786;font-size:12px;padding:20px}
</style></head><body><header><h1>Diario Elettrostrumentisti</h1><small>Prototipo personale · dati dimostrativi</small></header><main><div id="app"></div></main><footer>Versione di prova · dati salvati solo in questo browser</footer><script>
const rows=[['Fila 100',Array.from({length:13},(_,i)=>98+i)],['Fila 700 dispari',Array.from({length:11},(_,i)=>705+i*2)],['Fila 700 pari',Array.from({length:10},(_,i)=>704+i*2)],['Fila 500',Array.from({length:26},(_,i)=>500+i)],['Fila 600',Array.from({length:14},(_,i)=>601+i)]];
const operators=['Marconi','Piermarini','Masi','Giorgio Conti','Ceci','Ronci','Poggi','Cenci','Morelli'];
let data=JSON.parse(localStorage.getItem('de_entries')||'[]'),view='home',selected='',rowIndex=0,shiftOffset=-1,editId=null;
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('de_entries',JSON.stringify(data))}
function go(v){view=v;render();scrollTo(0,0)}
function back(){go('home')}
function bar(title){return `<div class="toolbar"><button class="secondary" onclick="back()">← Home</button><strong style="flex:3;align-self:center">${title}</strong></div>`}
function datefmt(d){return new Date(d).toLocaleString('it-IT')}
function shiftFor(t){let d=new Date(t),h=d.getHours();if(h<6)d.setDate(d.getDate()-1);let sh=h>=6&&h<14?0:h>=14&&h<22?1:2;d.setHours([6,14,22][sh],0,0,0);return d}
function shiftAt(offset){let d=shiftFor(Date.now());d.setHours(d.getHours()+8*offset);return d}
function entry(e){return `<div class="entry"><div><strong>BOM ${esc(e.bom)}</strong> · <span class="pill ${e.status==='chiuso'?'closed':'open'}">${e.status==='chiuso'?'CHIUSO':'DA PROSEGUIRE'}</span> ${e.type==='perdita'?'· Perdita '+esc(e.fluid):''}</div><div class="muted">${datefmt(e.time)} · ${esc(e.team)} · ${esc(e.operator)}</div><p>${esc(e.note)}</p>${e.photo?`<img class="photo" src="${e.photo}" alt="Foto perdita">`:''}<div class="row"><button class="secondary" onclick="details('${e.id}')">Dettagli / aggiorna</button></div></div>`}
function home(){let n=data.filter(e=>e.status==='aperto').length;return `<h2>Vulcanizzatori</h2><div class="card"><div class="map"><button class="hundred" onclick="chooseRow(0)">FILA<br>100</button><button class="seven" onclick="chooseRow(1)">700<br>DISPARI</button><button class="seven" onclick="chooseRow(2)">700<br>PARI</button><div style="display:flex;flex-direction:column;justify-content:flex-end;gap:7px;height:225px"><button class="six" style="height:75px" onclick="chooseRow(4)">FILA<br>600</button><button class="five" style="height:143px" onclick="chooseRow(3)">FILA<br>500</button></div></div></div><button class="nav danger" onclick="go('open')">Interventi aperti (${n}) →</button><button class="nav" onclick="shiftOffset=-1;go('diary')">Diario turni →</button><button class="nav" onclick="go('losses')">Segnalazioni perdite →</button><button class="nav secondary" onclick="go('password')">Password BOM →</button><button class="nav secondary" onclick="go('search')">Cerca nello storico →</button><button class="nav secondary" onclick="go('backup')">Esporta / importa dati →</button>`}
function chooseRow(i){rowIndex=i;go('row')}
function chooseBom(n){selected=n;go('bom')}
function form(type='intervento'){let current=localStorage.getItem('de_pref')||'{}',prefs=JSON.parse(current);return `${bar(type==='perdita'?'Nuova segnalazione perdita':'Nuovo intervento')}<div class="card"><form id="newform"><label>BOM</label><select name="bom" required>${rows.flatMap(r=>r[1]).map(n=>`<option ${String(selected)===String(n)?'selected':''}>${n}</option>`).join('')}</select><div class="row"><div><label>Squadra</label><select name="team">${['A','B','C','D'].map(x=>`<option ${prefs.team===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Operatore</label><select name="operator">${operators.map(x=>`<option ${prefs.operator===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div>${type==='perdita'?`<label>Tipo di perdita</label><select name="fluid"><option>Vapore</option><option>Acqua</option><option>Aria</option><option>Altro</option></select><label>Fotografia (facoltativa, compressa)</label><input type="file" id="photo" accept="image/*" capture="environment">`:''}<label>Descrizione / nota</label><textarea name="note" id="note" required placeholder="Descrivi cosa è successo e cosa è stato fatto"></textarea><button type="button" class="secondary" id="mic" style="width:100%;margin-top:8px">🎙 Tieni premuto per dettare (se supportato)</button><p class="muted">La dettatura dipende dal browser. Controlla sempre il testo prima di salvare.</p><label>Stato</label><select name="status"><option value="aperto">Da proseguire</option><option value="chiuso">Chiuso</option></select><button class="good" style="width:100%;margin-top:14px" type="submit">Salva ${type==='perdita'?'segnalazione':'intervento'}</button></form></div>`}
function wireForm(type){let f=document.getElementById('newform');f.onsubmit=async ev=>{ev.preventDefault();let v=Object.fromEntries(new FormData(f));localStorage.setItem('de_pref',JSON.stringify({team:v.team,operator:v.operator}));let photo='';let file=document.getElementById('photo')?.files[0];if(file){try{photo=await compress(file)}catch(err){alert('Foto non elaborabile');return}}data.unshift({id:crypto.randomUUID(),time:new Date().toISOString(),type,photo,...v,updates:[]});try{save()}catch(err){data.shift();alert('Memoria locale piena: esporta i dati e riprova senza foto.');return}go(type==='perdita'?'losses':'bom')};let b=document.getElementById('mic');let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){b.textContent='Dettatura non disponibile: usa la tastiera';b.disabled=true;return}let rec=new SR();rec.lang='it-IT';rec.continuous=true;rec.interimResults=false;rec.onresult=e=>{let t=[...e.results].map(x=>x[0].transcript).join(' ');f.note.value=(f.note.value+' '+t).trim()};rec.onerror=()=>{b.textContent='Microfono non disponibile'};b.onpointerdown=e=>{e.preventDefault();try{rec.start();b.textContent='🎙 Dettatura in corso… rilascia per fermare'}catch{}};b.onpointerup=b.onpointercancel=()=>{try{rec.stop()}catch{}b.textContent='🎙 Tieni premuto per dettare (se supportato)'}}
function compress(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/webp',.65))};img.onerror=reject;img.src=url})}
function details(id){editId=id;go('detail')}
function render(){let out='';if(view==='home')out=home();if(view==='row')out=bar(rows[rowIndex][0])+`<div class="card numbergrid">${rows[rowIndex][1].map(n=>`<button onclick="chooseBom(${n})">${n}</button>`).join('')}</div>`;if(view==='bom'){let list=data.filter(e=>String(e.bom)===String(selected));out=bar('BOM '+selected)+`<button class="good nav" onclick="go('new')">+ Nuovo intervento</button><button class="nav secondary" onclick="go('newloss')">+ Segnala perdita</button><div class="card"><h2>Storico BOM ${selected}</h2>${list.map(entry).join('')||'<p>Nessun intervento registrato.</p>'}</div>`}
if(view==='new'||view==='newloss')out=form(view==='newloss'?'perdita':'intervento');
if(view==='open')out=bar('Interventi aperti')+`<div class="card"><h2>${data.filter(e=>e.status==='aperto').length} interventi da proseguire</h2>${data.filter(e=>e.status==='aperto').sort((a,b)=>new Date(a.time)-new Date(b.time)).map(e=>`<div class="muted">Aperto da ${Math.floor((Date.now()-new Date(e.time))/86400000)} giorni</div>`+entry(e)).join('')||'<p>Nessun intervento aperto.</p>'}</div>`;
if(view==='losses')out=bar('Segnalazioni perdite')+`<button class="nav good" onclick="go('newloss')">+ Nuova perdita</button><div class="card"><h2>Perdite aperte</h2>${data.filter(e=>e.type==='perdita'&&e.status==='aperto').map(entry).join('')||'<p>Nessuna perdita aperta.</p>'}<h2>Storico perdite chiuse</h2>${data.filter(e=>e.type==='perdita'&&e.status==='chiuso').map(entry).join('')||'<p>Nessuna perdita chiusa.</p>'}</div>`;
if(view==='diary'){let start=shiftAt(shiftOffset),end=new Date(start.getTime()+8*3600000);out=bar('Diario turni')+`<div class="card"><div class="row"><button onclick="shiftOffset--;render()">←</button><div style="flex:3;text-align:center"><strong>${datefmt(start)}</strong><br><span class="muted">fino alle ${end.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</span></div><button onclick="shiftOffset++;render()">→</button></div>${data.filter(e=>new Date(e.time)>=start&&new Date(e.time)<end).map(entry).join('')||'<p>Nessuna nota per questo turno.</p>'}</div>`}
if(view==='password')out=bar('Password BOM')+'<div class="card"><h2>Password aggiornata</h2><p class="muted">Pagina dimostrativa. Nessuna credenziale memorizzata e nessuna data di aggiornamento verificata.</p></div>';
if(view==='search')out=bar('Cerca nello storico')+`<div class="card"><input id="query" placeholder="BOM, allarme, parola chiave…" oninput="searchResults(this.value)"><div id="results"></div></div>`;
if(view==='backup')out=bar('Esporta / importa')+`<div class="card"><p>I dati sono salvati nel browser di questo dispositivo. Non sono condivisi tra telefoni.</p><button class="nav good" onclick="exportData()">Esporta backup JSON</button><label>Importa backup JSON (sostituisce i dati locali)</label><input type="file" accept=".json,application/json" onchange="importData(this.files[0])"><p class="muted">Esporta regolarmente. Non inserire informazioni aziendali reali nel prototipo.</p></div>`;
if(view==='detail'){let e=data.find(x=>x.id===editId);if(!e){go('home');return}out=bar('BOM '+e.bom)+`<div class="card">${entry(e)}<h2>Aggiornamenti</h2>${(e.updates||[]).map(u=>`<div class="entry"><div class="muted">${datefmt(u.time)} · ${esc(u.operator)}</div><p>${esc(u.note)}</p></div>`).join('')||'<p>Nessun aggiornamento.</p>'}<form id="updateform"><label>Operatore</label><select name="operator">${operators.map(x=>`<option>${esc(x)}</option>`).join('')}</select><label>Nuovo aggiornamento</label><textarea name="note" placeholder="Verifica effettuata, soluzione…"></textarea><label>Stato</label><select name="status"><option value="aperto" ${e.status==='aperto'?'selected':''}>Da proseguire</option><option value="chiuso" ${e.status==='chiuso'?'selected':''}>Chiuso</option></select><button class="good nav">Salva aggiornamento</button></form></div>`}
app.innerHTML=out;if(view==='new'||view==='newloss')wireForm(view==='newloss'?'perdita':'intervento');if(view==='search')searchResults('');if(view==='detail'){document.getElementById('updateform').onsubmit=ev=>{ev.preventDefault();let e=data.find(x=>x.id===editId),v=Object.fromEntries(new FormData(ev.target));if(!v.note.trim()&&v.status===e.status){alert('Inserisci una nota o cambia lo stato.');return}e.updates.push({time:new Date().toISOString(),operator:v.operator,note:v.note||'Stato aggiornato'});e.status=v.status;if(e.type==='perdita'&&e.status==='chiuso')e.photo='';save();render()}}}
function searchResults(q){let el=document.getElementById('results');if(el)el.innerHTML=data.filter(e=>(e.bom+' '+e.note+' '+(e.updates||[]).map(x=>x.note).join(' ')).toLowerCase().includes(q.toLowerCase())).map(entry).join('')||'<p>Nessun risultato.</p>'}
function exportData(){let blob=new Blob([JSON.stringify({version:1,entries:data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='diario-elettrostrumentisti-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.entries))throw Error();if(confirm('Sostituire tutte le note locali con il backup selezionato?')){data=obj.entries;save();go('home')}}catch{alert('File di backup non valido')}}
render();
</script></body></html>
